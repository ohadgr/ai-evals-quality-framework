name: AI Evals

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  evaluate:
    name: AI Evals / Test Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

          curl -o allure.tgz -L \
            https://github.com/allure-framework/allure2/releases/download/2.35.1/allure-2.35.1.tgz

          tar -zxvf allure.tgz
          sudo mv allure-2.35.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Run AI evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest -m "not manual" --alluredir=allure-results -ra

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload GitHub Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Add evaluation summary
        if: always()
        run: |
          echo "## 🤖 AI Evals / Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Evaluation Framework" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Golden Dataset" >> $GITHUB_STEP_SUMMARY
          echo "- Deterministic Evaluator" >> $GITHUB_STEP_SUMMARY
          echo "- LLM-as-a-Judge" >> $GITHUB_STEP_SUMMARY
          echo "- Agent Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "- pytest + Allure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Allure report will be published after the deployment job completes." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Allure Report
    if: always() && github.ref == 'refs/heads/main'
    needs: evaluate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Allure report to job summary
        if: always()
        run: |
          echo "## 📊 AI Evals Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### [📊 Allure Report ↗](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Latest AI evaluation report generated and published by this workflow." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Report contents:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Generated Support Agent responses" >> $GITHUB_STEP_SUMMARY
          echo "- Deterministic evaluator results" >> $GITHUB_STEP_SUMMARY
          echo "- LLM Judge scores" >> $GITHUB_STEP_SUMMARY
          echo "- Agent Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "- Evaluation summary" >> $GITHUB_STEP_SUMMARY
          echo "- Agent latency" >> $GITHUB_STEP_SUMMARY
